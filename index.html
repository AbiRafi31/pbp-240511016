<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>✨ My Tasks</h1>
      <p>Kelola harimu dengan lebih produktif.</p>
    </header>

    <form id="form-todo">
      <input type="text" id="input-todo" placeholder="Apa yang ingin kamu lakukan hari ini?" required autocomplete="off">
      <button type="submit">Tambah</button>
    </form>

    <div class="stats-container">
      <p id="stats">0 tugas belum selesai</p>
    </div>

    <ul id="list-todo"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
